# huly-gitlab dev compose — full Huly stack + GitLab CE + pod-gitlab
# Image tags sourced from huly-selfhost/compose.yml (HULY_VERSION=v0.7.423)

name: ${DOCKER_NAME:-huly-gitlab-dev}

networks:
  huly-gitlab-net:
    driver: bridge

volumes:
  mongo-data:
  minio-data:
  elastic-data:
  cr-data:
  cr-certs:
  redpanda-data:
  gitlab-data:
  gitlab-logs:
  gitlab-config:

services:

  # ------------------------------------------------------------------
  # Infrastructure shared by huly-gitlab pod and Huly services
  # ------------------------------------------------------------------

  mongo:
    image: mongo:7-jammy
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - huly-gitlab-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --address ":9000" --console-address ":9001"
    restart: unless-stopped
    volumes:
      - minio-data:/data
    networks:
      - huly-gitlab-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  elastic:
    image: elasticsearch:7.14.2
    command: >
      /bin/sh -c "
        ./bin/elasticsearch-plugin list | grep -q ingest-attachment ||
        yes | ./bin/elasticsearch-plugin install --silent ingest-attachment;
        /usr/local/bin/docker-entrypoint.sh eswrapper"
    restart: unless-stopped
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - http.cors.enabled=true
      - http.cors.allow-origin=http://localhost:8087
    networks:
      - huly-gitlab-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 20s
      timeout: 10s
      retries: 10

  cockroach:
    image: cockroachdb/cockroach:latest-v24.2
    command: start-single-node --accept-sql-without-tls
    restart: unless-stopped
    volumes:
      - cr-data:/cockroach/cockroach-data
      - cr-certs:/cockroach/certs
    environment:
      - COCKROACH_DATABASE=${CR_DATABASE:-huly}
      - COCKROACH_USER=${CR_USERNAME:-huly}
      - COCKROACH_PASSWORD=${CR_USER_PASSWORD:-huly-cockroach-secret}
    networks:
      - huly-gitlab-net

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    restart: unless-stopped
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    environment:
      - REDPANDA_SUPERUSER_USERNAME=${REDPANDA_ADMIN_USER:-admin}
      - REDPANDA_SUPERUSER_PASSWORD=${REDPANDA_ADMIN_PWD:-redpanda-admin-secret}
    networks:
      - huly-gitlab-net
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "-X", "user=${REDPANDA_ADMIN_USER:-admin}", "-X", "pass=${REDPANDA_ADMIN_PWD:-redpanda-admin-secret}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  # ------------------------------------------------------------------
  # Huly services — image tags from huly-selfhost/compose.yml
  # ------------------------------------------------------------------

  stats:
    image: hardcoreeng/stats:${HULY_VERSION:-v0.7.423}
    restart: unless-stopped
    environment:
      - PORT=4900
      - SERVER_SECRET=${SECRET:-change-me-shared-secret}
    networks:
      - huly-gitlab-net

  rekoni:
    image: hardcoreeng/rekoni-service:${HULY_VERSION:-v0.7.423}
    restart: unless-stopped
    environment:
      - SECRET=${SECRET:-change-me-shared-secret}
    deploy:
      resources:
        limits:
          memory: 500M
    networks:
      - huly-gitlab-net

  account:
    image: hardcoreeng/account:${HULY_VERSION:-v0.7.423}
    restart: unless-stopped
    depends_on:
      cockroach:
        condition: service_started
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - SERVER_PORT=3000
      - SERVER_SECRET=${SECRET:-change-me-shared-secret}
      - DB_URL=${CR_DB_URL:-postgres://huly:huly-cockroach-secret@cockroach:26257/huly}
      - TRANSACTOR_URL=ws://transactor:3333;ws://${HOST_ADDRESS:-localhost}/_transactor
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - FRONT_URL=http://${HOST_ADDRESS:-localhost}:${HTTP_PORT:-8087}
      - STATS_URL=http://stats:4900
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=http://account:3000
      - ACCOUNT_PORT=3000
      - QUEUE_CONFIG=redpanda:9092
    networks:
      - huly-gitlab-net

  transactor:
    image: hardcoreeng/transactor:${HULY_VERSION:-v0.7.423}
    restart: unless-stopped
    depends_on:
      cockroach:
        condition: service_started
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
      stats:
        condition: service_started
    environment:
      - SERVER_PORT=3333
      - SERVER_SECRET=${SECRET:-change-me-shared-secret}
      - DB_URL=${CR_DB_URL:-postgres://huly:huly-cockroach-secret@cockroach:26257/huly}
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - FRONT_URL=http://${HOST_ADDRESS:-localhost}:${HTTP_PORT:-8087}
      - ACCOUNTS_URL=http://account:3000
      - FULLTEXT_URL=http://fulltext:4700
      - STATS_URL=http://stats:4900
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - QUEUE_CONFIG=redpanda:9092
    networks:
      - huly-gitlab-net

  collaborator:
    image: hardcoreeng/collaborator:${HULY_VERSION:-v0.7.423}
    restart: unless-stopped
    depends_on:
      account:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      - COLLABORATOR_PORT=3078
      - SECRET=${SECRET:-change-me-shared-secret}
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
    networks:
      - huly-gitlab-net

  workspace:
    image: hardcoreeng/workspace:${HULY_VERSION:-v0.7.423}
    restart: unless-stopped
    depends_on:
      cockroach:
        condition: service_started
      redpanda:
        condition: service_healthy
      account:
        condition: service_started
    environment:
      - SERVER_SECRET=${SECRET:-change-me-shared-secret}
      - DB_URL=${CR_DB_URL:-postgres://huly:huly-cockroach-secret@cockroach:26257/huly}
      - TRANSACTOR_URL=ws://transactor:3333;ws://${HOST_ADDRESS:-localhost}/_transactor
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
      - ACCOUNTS_DB_URL=${CR_DB_URL:-postgres://huly:huly-cockroach-secret@cockroach:26257/huly}
    networks:
      - huly-gitlab-net

  fulltext:
    image: hardcoreeng/fulltext:${HULY_VERSION:-v0.7.423}
    restart: unless-stopped
    depends_on:
      elastic:
        condition: service_healthy
      cockroach:
        condition: service_started
      redpanda:
        condition: service_healthy
    environment:
      - SERVER_SECRET=${SECRET:-change-me-shared-secret}
      - DB_URL=${CR_DB_URL:-postgres://huly:huly-cockroach-secret@cockroach:26257/huly}
      - FULLTEXT_DB_URL=http://elastic:9200
      - ELASTIC_INDEX_NAME=huly_storage_index
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - REKONI_URL=http://rekoni:4004
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
    networks:
      - huly-gitlab-net

  front:
    image: hardcoreeng/front:${HULY_VERSION:-v0.7.423}
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8087}:8080"
    depends_on:
      account:
        condition: service_started
      transactor:
        condition: service_started
      collaborator:
        condition: service_started
    environment:
      - SERVER_PORT=8080
      - SERVER_SECRET=${SECRET:-change-me-shared-secret}
      - ACCOUNTS_URL=http://${HOST_ADDRESS:-localhost}:${HTTP_PORT:-8087}/_accounts
      - ACCOUNTS_URL_INTERNAL=http://account:3000
      - REKONI_URL=http://${HOST_ADDRESS:-localhost}:${HTTP_PORT:-8087}/_rekoni
      - COLLABORATOR_URL=ws://${HOST_ADDRESS:-localhost}:${HTTP_PORT:-8087}/_collaborator
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - ELASTIC_URL=http://elastic:9200
      - STATS_URL=http://${HOST_ADDRESS:-localhost}:${HTTP_PORT:-8087}/_stats
      - UPLOAD_URL=/files
      - TITLE=${TITLE:-Huly Self Host}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-en}
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - DESKTOP_UPDATES_CHANNEL=${DESKTOP_CHANNEL:-0.7.423}
      - DISABLED_FEATURES=auto-translate,mailboxes
    networks:
      - huly-gitlab-net

  # ------------------------------------------------------------------
  # GitLab CE — baseline version 16.11.10 for E2E tests
  # For testing newer GitLab versions set GITLAB_IMAGE_TAG in .env:
  #   GITLAB_IMAGE_TAG=17.x.y-ce.0
  # ------------------------------------------------------------------
  gitlab:
    image: gitlab/gitlab-ce:${GITLAB_IMAGE_TAG:-16.11.10-ce.0}
    restart: unless-stopped
    hostname: gitlab
    ports:
      - "8929:80"
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab:8929'
        gitlab_rails['gitlab_shell_ssh_port'] = 2224
        nginx['listen_port'] = 80
    shm_size: 256m
    networks:
      - huly-gitlab-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/-/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 10

  # ------------------------------------------------------------------
  # huly-gitlab pod
  # ------------------------------------------------------------------
  pod-gitlab:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      account:
        condition: service_started
      transactor:
        condition: service_started
      gitlab:
        condition: service_healthy
    environment:
      - PORT=${PORT:-3600}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:3600}
      - ACCOUNTS_URL=http://account:3000
      - SERVER_SECRET=${SECRET:-change-me-shared-secret}
      - SERVICE_ID=${SERVICE_ID:-gitlab-service}
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB=${MONGO_DB:-huly-gitlab}
      - GITLAB_BASE_URL=${GITLAB_BASE_URL:-http://gitlab:8929}
      - GITLAB_CLIENT_ID=${GITLAB_CLIENT_ID}
      - GITLAB_CLIENT_SECRET=${GITLAB_CLIENT_SECRET}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}
      - WEBHOOK_SECRET_SEED=${WEBHOOK_SECRET_SEED}
      - ALLOWED_WORKSPACES=${ALLOWED_WORKSPACES:-*}
      - BACKFILL_INTERVAL_MS=${BACKFILL_INTERVAL_MS:-300000}
      - RATE_LIMIT=${RATE_LIMIT:-25}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - BRANDING_PATH=${BRANDING_PATH:-}
    ports:
      - "3600:3600"
    networks:
      - huly-gitlab-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3600/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
